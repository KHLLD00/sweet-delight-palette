name: Update social preview assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare assets
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p public
          convert src/assets/logo.jpg -auto-orient -resize '1200x1200>' -gravity center -background white -extent 1200x1200 public/og-image.jpg
          convert src/assets/logo.jpg -auto-orient -resize '512x512>' -gravity center -background white -extent 512x512 public/favicon.ico

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/favicon.ico public/og-image.jpg
          git commit -m "Update Ease Cakes favicon and social preview image"
          git pull --rebase origin main
          git push origin HEAD:main
